name: Deploy Astro Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Astro portfolio
        uses: actions/checkout@v4

      - name: Checkout original school projects
        uses: actions/checkout@v4
        with:
          repository: Fmart0893/fmartinez062023
          ref: main
          path: legacy-source
          persist-credentials: false

      - name: Include archived projects in the published site
        shell: bash
        run: |
          mkdir -p public/legacy
          cp -R legacy-source/. public/legacy/
          rm -rf public/legacy/.git
          python3 - <<'PY'
          from pathlib import Path
          root = Path("public/legacy")
          old = "https://chsserver01.org/2023/fmartinez062023/"
          new = "/MartinezFAstro/legacy/"
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".css", ".js"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Build Astro website
        uses: withastro/action@v3
        with:
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
